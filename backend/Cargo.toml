[package]
name = "backend"
version = "0.1.0"
edition = "2021"
default-run = "backend"

[dependencies]
rsground-runner = { path = "./runner" }

chrono = "0.4"
dotenvy = "0.15.7"
env_logger = "0.11.7"
futures = "0.3"
log = "0.4"
thiserror.workspace = true
tokio.workspace = true

# Auth
argon2 = "0.5.3"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
oauth2 = "5"
reqwest = { version = "0.12.15", features = ["json", "default-tls"] }
uuid = { version = "1.3", features = ["serde", "v4"] }

# Http server
actix = "0.13"
actix-cors = "0.7.1"
# 1.2 deprecates these macros in favor of a GPL-licensed replacement; keep the
# existing MIT-compatible integration pinned until that licensing decision is explicit.
actix_error_proc = { version = "=1.1.4", features = ["thiserror"] }
actix-web = "4"
actix-ws = "0.3.0"

# OT
bytecount.workspace = true
operational-transform.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
awc = "3" # Http & WebSocket Client for Actix
actix-rt = { version = "2.10.0", features = ["macros"] }
futures-util = "0.3"
lazy_static = "1.4"
once_cell = "1.17"
