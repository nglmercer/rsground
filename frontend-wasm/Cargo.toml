[package]
name = "frontend-wasm"
version = "0.1.0"
description = "WebAssembly operational-transform bindings for RsGround"
repository = "https://github.com/RustLangES/rsground"
license = "MIT"
authors = ["Apika Luca"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# OT
bytecount.workspace = true
operational-transform.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Wasm
console_error_panic_hook = { version = "0.1" }
wasm-bindgen = "0.2"
js-sys = "0.3"
